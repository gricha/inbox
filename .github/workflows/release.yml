name: release

# A v* tag (npm run release <version> makes one) builds macOS, Linux and Windows and publishes them as one GitHub Release,
# with electron-builder's latest*.yml beside them for the app's updater. Each build only builds; one job publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: The tag is package.json's version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME, but package.json says $version: npm run release <version> sets both"
            exit 1
          fi
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run check

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Published by the release job below, not here: three builds racing to make one release would make three.
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Inbox ${GITHUB_REF_NAME#v}" --generate-notes
