# The Xcode project is generated from this file: `xcodegen generate` in ios/ after adding or removing a file.
name: Inbox
options:
  bundleIdPrefix: dev.inbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Inbox:
    type: application
    platform: iOS
    sources:
      - path: Inbox
        excludes:
          - "**/*.md"
    info:
      path: Inbox/Info.plist
      properties:
        CFBundleDisplayName: Inbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Paper
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - instrument-sans-latin-standard-normal.ttf
          - jetbrains-mono-latin-wght-normal.ttf
        # Plain http only to this machine: the Simulator on the desk's own Mac, and the mock.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.inbox.ios
        PRODUCT_NAME: Inbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
  InboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InboxTests
    dependencies:
      - target: Inbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.inbox.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Inbox:
    build:
      targets:
        Inbox: all
        InboxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InboxTests
