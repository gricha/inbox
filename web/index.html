<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review Desk</title>
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- This device's theme (web/src/theme.ts): the desktop app's, else this browser's, before the first paint. The ids are
         src/themes.ts's, which can't be imported here; web/test/themes.test.ts keeps them and the colours above in step. -->
    <script>
      try {
        const app = window.desktop && window.desktop.theme;
        let t = typeof app === "string" ? app : localStorage.getItem("desk.theme");
        // Omarchy: its theme as last shown, a theme of ours or tokens made from its colours, until the desk answers.
        if (t === "omarchy") {
          const o = JSON.parse(localStorage.getItem("desk.omarchy"));
          for (const k in o.tokens) document.documentElement.style.setProperty(k, o.tokens[k]);
          t = o.tokens ? "omarchy" : o.theme;
        }
        if (
          t === "omarchy" ||
          [
            "light",
            "dark",
            "sand",
            "slate",
            "solarized",
            "catppuccin",
            "sentry",
            "sentry-dawn",
            "gruvbox",
            "tokyo-night",
            "everforest",
            "kanagawa",
            "nord",
            "rose-pine",
            "flexoki-light",
          ].includes(t)
        )
          document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
